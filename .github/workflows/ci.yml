name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-ai_agent-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      # Undefined names, unused imports and syntax errors (the checks the code is kept clean of).
      - run: pip install ruff==0.15.22
      - run: ruff check --select F,E9 --output-format github ai_agent

  tests:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      # node runs the client script analyzer (customization/analyzers/js_check.mjs)
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install MariaDB Client
        run: |
          sudo apt update
          sudo apt-get install mariadb-client

      - name: Setup bench
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --frappe-branch version-16 --python "$(which python)" ~/frappe-bench

      # ai_agent's tests read and write ERPNext documents (Sales Invoice, Customer, Company, ...).
      - name: Install
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app --branch version-16 --skip-assets erpnext
          bench get-app --skip-assets ai_agent $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench set-config -g server_script_enabled 1
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app erpnext
          bench --site test_site install-app ai_agent
        env:
          CI: 'Yes'

      - name: Run tests
        working-directory: /home/runner/frappe-bench
        run: |
          set -o pipefail
          exec > >(tee -a /tmp/tests.log) 2>&1
          bench --site test_site set-config allow_tests true
          bench --site test_site execute ai_agent.tests.utils.seed_ci_site
          bench --site test_site run-tests --app ai_agent
        env:
          TYPE: server

      # Job logs need a GitHub sign-in; the summary and annotations are public.
      - name: Report failures
        if: failure()
        run: python $GITHUB_WORKSPACE/.github/helper/test_report.py /tmp/tests.log "$GITHUB_STEP_SUMMARY"

<!doctype html>
<!--
  mock.html — standalone harness for the chat client (no server needed).
  Stubs `frappe` (xcall fixtures per endpoint, a scripted realtime stream,
  markdown via showdown, frappe.Chart via frappe-charts), loads chat.css and
  the modules in order, and mounts the app. Open with ?dir=rtl&lang=ar or
  ?dir=ltr, add &theme=dark for the dark tokens.
-->
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Chat mock</title>
    <link rel="stylesheet" href="../../css/chat.css" />
    <style>
        html, body { margin: 0; height: 100%; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Arabic", Arial, sans-serif; background: #fff; }
        .navbar { height: 48px; display: flex; align-items: center; padding: 0 16px; background: #fff; border-bottom: 1px solid #e3e2dd; font-size: 14px; color: #6f6e68; }
        [data-theme="dark"] body, [data-theme="dark"] .navbar { background: #1b1b19; color: #a6a59e; border-color: #363633; }
        .layout-main-section { min-height: 0; }
    </style>
    <script src="../../../../../frappe/node_modules/showdown/dist/showdown.min.js"></script>
    <script src="../../../../../frappe/node_modules/frappe-charts/dist/frappe-charts.umd.js"></script>
</head>
<body>
    <nav class="navbar">Frappe navbar (mock)</nav>
    <div class="page-container ai-chat-page" id="page-agent-workspace">
        <div class="page-body"><div class="container"><div class="row layout-main"><div class="layout-main-section-wrapper"><div class="layout-main-section" id="main"></div></div></div></div></div>
    </div>

    <script>
    (function () {
        const params = new URLSearchParams(location.search);
        const dir = params.get("dir") || "rtl";
        const lang = params.get("lang") || (dir === "rtl" ? "ar" : "en");
        document.documentElement.setAttribute("dir", dir);
        document.documentElement.setAttribute("lang", lang);
        document.documentElement.setAttribute("data-theme", params.get("theme") === "dark" ? "dark" : "light");
        window.MOCK = { events: [], calls: [], speed: Number(params.get("speed") || 1) };

        /* ---------------- fixtures ---------------- */
        const now = () => {
            const d = new Date();
            const p = (n) => String(n).padStart(2, "0");
            return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
        };
        const ago = (hours) => {
            const d = new Date(Date.now() - hours * 3600000);
            const p = (n) => String(n).padStart(2, "0");
            return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
        };
        const usage = { input_tokens: 4210, output_tokens: 812, cache_read_input_tokens: 0, cache_creation_input_tokens: 0, estimated_cost: 0.0042 };
        const session = (name, title, hours, extra) => Object.assign({
            name, title, agent: "ERP Analyst", company: "Sanad Digital", provider: "Default", model: "deepseek-v4-flash",
            status: "Active", pinned: 0, last_message_on: ago(hours), message_count: 6, preview: "إجمالي المبيعات لهذا الشهر 1,240,000 ر.س بزيادة 12% …",
            usage, context_tokens: 18400, context_window: 128000, last_seq: 6,
        }, extra || {});
        const sessions = [
            session("CHAT-00012", "تحليل مبيعات الربع الثالث", 1, { pinned: 1, context_tokens: 61000 }),
            session("CHAT-00011", "الفواتير المتأخرة السداد", 3),
            session("CHAT-00010", "تجهيز عرض سعر لشركة النور", 26),
            session("CHAT-00009", "مراجعة هوامش الربح حسب الفرع", 80),
            session("CHAT-00008", "أسئلة عن حساب الإهلاك", 400, { preview: "الإهلاك يُحتسب بطريقة القسط الثابت …" }),
        ];
        const rows = [
            { الفرع: "الرياض", المبيعات: 512000, الهدف: 480000, "النسبة %": 106.7 },
            { الفرع: "جدة", المبيعات: 388000, الهدف: 400000, "النسبة %": 97.0 },
            { الفرع: "الدمام", المبيعات: 214000, الهدف: 200000, "النسبة %": 107.0 },
            { الفرع: "مكة", المبيعات: 126000, الهدف: 150000, "النسبة %": 84.0 },
        ];
        const historyMessages = [
            { name: "m1", session: "CHAT-00012", seq: 1, role: "user", status: "completed", text: "لخّص مبيعات هذا الشهر حسب الفرع مقارنة بالهدف", created_at: ago(1.2), completed_at: ago(1.2), attachments: [{ name: "File-1", file_name: "targets-q3.xlsx", file_url: "/private/files/targets-q3.xlsx", file_size: 48213 }], blocks: [], feedback: 0, usage: {} },
            {
                name: "m2", session: "CHAT-00012", seq: 2, role: "assistant", status: "completed", created_at: ago(1.2), completed_at: ago(1.19), duration_ms: 9400,
                model: "deepseek-v4-flash", provider: "Default", stop_reason: "end_turn", error: null, usage, context_tokens: 18400, attachments: [], feedback: 1, event_seq: 14,
                text: "",
                blocks: [
                    { seq: 0, kind: "thinking", status: "completed", text: "المستخدم يريد مقارنة المبيعات بالهدف لكل فرع. سأستعلم عن فواتير المبيعات المعتمدة لهذا الشهر مجمّعة بالفرع ثم أقارنها بالأهداف من الملف المرفق.", started_at: ago(1.2), completed_at: ago(1.2), duration_ms: 4200 },
                    { seq: 1, kind: "skill", status: "completed", name: "sales-analysis", data: { title: "تحليل المبيعات", description: "استعلامات مبيعات جاهزة", tools: ["data__query"] } },
                    { seq: 2, kind: "tool_use", status: "completed", id: "toolu_01", name: "data__query", data: { doctype: "Sales Invoice", filters: { docstatus: 1, posting_date: ["Timespan", "this month"] }, group_by: "branch", fields: ["branch", "sum(grand_total) as total"] }, duration_ms: 812 },
                    { seq: 3, kind: "tool_result", status: "completed", id: "toolu_01", name: "data__query", text: "4 rows", data: { columns: ["branch", "total"], rows: [{ branch: "الرياض", total: 512000 }, { branch: "جدة", total: 388000 }, { branch: "الدمام", total: 214000 }, { branch: "مكة", total: 126000 }], row_count: 4 }, duration_ms: 812 },
                    { seq: 4, kind: "artifact", status: "completed", data: { artifact: "ART-0001", artifact_type: "Table", title: "المبيعات مقابل الهدف حسب الفرع", summary: "إجمالي الشهر 1,240,000 ر.س مقابل هدف 1,230,000 ر.س", row_count: 812, is_truncated: true, columns: ["الفرع", "المبيعات", "الهدف", "النسبة %"], rows } },
                    { seq: 5, kind: "artifact", status: "completed", data: { artifact: "ART-0002", artifact_type: "Chart", title: "المبيعات حسب الفرع", row_count: 4, is_truncated: false, chart: { type: "bar", labels: ["الرياض", "جدة", "الدمام", "مكة"], datasets: [{ name: "المبيعات", values: [512, 388, 214, 126] }, { name: "الهدف", values: [480, 400, 200, 150] }] } } },
                    { seq: 6, kind: "text", status: "completed", text: "## ملخص الشهر\n\nإجمالي المبيعات **1,240,000 ر.س** مقابل هدف 1,230,000 ر.س (تحقيق **100.8%**).\n\n- **الرياض** والدمام تجاوزا الهدف.\n- **جدة** قريبة من الهدف (97%).\n- **مكة** الأضعف عند 84% — يستحق متابعة.\n\n| الفرع | الفجوة |\n|---|---|\n| مكة | -24,000 |\n| جدة | -12,000 |\n\nهل تريد تفصيل مكة حسب مندوب المبيعات؟" },
                    { seq: 7, kind: "memory", status: "completed", data: { memory: "المستخدم يتابع أداء الفروع مقابل الأهداف شهرياً" } },
                ],
            },
            { name: "m3", session: "CHAT-00012", seq: 3, role: "user", status: "completed", text: "نعم، فصّل مكة حسب المندوب", created_at: ago(1.1), completed_at: ago(1.1), attachments: [], blocks: [], feedback: 0, usage: {} },
            {
                name: "m4", session: "CHAT-00012", seq: 4, role: "assistant", status: "failed", created_at: ago(1.1), completed_at: ago(1.09), duration_ms: 3100, model: "deepseek-v4-flash", provider: "Default",
                error: "انتهت مهلة المزوّد (timeout after 30s)", usage: {}, attachments: [], feedback: 0, event_seq: 3, text: "",
                blocks: [{ seq: 0, kind: "tool_use", status: "failed", id: "toolu_02", name: "data__query", data: { doctype: "Sales Invoice", filters: { branch: "مكة" } } }, { seq: 1, kind: "tool_result", status: "failed", id: "toolu_02", is_error: true, data: { error: "Timeout" } }],
            },
        ];

        const boot = {
            user: { name: "dev-t@sanad.digital", full_name: "Dev T", image: null, language: lang, dir },
            agents: [
                { name: "ERP Analyst", agent_name: "محلل ERP", description: "تحليل البيانات والتقارير", read_only: 0, allow_actions: 1, is_default: 1 },
                { name: "Reader", agent_name: "قارئ", description: "قراءة فقط", read_only: 1, allow_actions: 0, is_default: 0 },
            ],
            providers: [
                { name: "Default", label: "DeepSeek", provider_type: "OpenAI Compatible", is_default: 1, models: [{ model_name: "deepseek-v4-flash", label: "DeepSeek V4 Flash", is_default: 1, supports_thinking: 1 }, { model_name: "deepseek-v4-pro", label: "DeepSeek V4 Pro", is_default: 0, supports_thinking: 1 }] },
                { name: "Anthropic", label: "Anthropic", provider_type: "Anthropic", is_default: 0, models: [{ model_name: "claude-sonnet-4-5", label: "Claude Sonnet 4.5", is_default: 0, supports_thinking: 1 }] },
            ],
            settings: { third_party_warning: "", thinking_options: ["off", "adaptive", "on"] },
            sessions,
        };

        /* ---------------- realtime script ---------------- */
        const listeners = {};
        let route = ["agent-workspace"];
        let msgCounter = 100;
        let sessionCounter = 13;
        const timers = [];
        function emit(payload) {
            window.MOCK.events.push(payload);
            (listeners["ai_agent:chat"] || []).forEach((fn) => fn(payload));
        }
        function schedule(list) {
            let t = 0;
            let seq = 0;
            list.forEach(([delay, sessionName, messageName, event]) => {
                t += delay / window.MOCK.speed;
                seq += 1;
                const mySeq = seq;
                timers.push(setTimeout(() => emit({ session: sessionName, message: messageName, seq: mySeq, event }), t));
            });
            return t;
        }
        const words = "بحسب بيانات فواتير المبيعات المعتمدة لهذا الشهر، حقّق فرع الرياض أعلى مبيعات بقيمة **512,000 ر.س** متجاوزاً هدفه بنسبة 6.7%. أما فرع مكة فبلغ **126,000 ر.س** فقط أي 84% من الهدف.\n\n### التوصية\n\n1. مراجعة خط أنابيب المبيعات في مكة.\n2. نقل جزء من الحملة التسويقية إلى جدة.\n\nيمكنني تجهيز تقرير مفصّل لو أردت.".split(" ");
        function streamReply(sessionName, messageName, phase) {
            const ev = [];
            ev.push([200, sessionName, messageName, { type: "message.started", model: "deepseek-v4-flash", provider: "Default", resumed: false }]);
            ev.push([100, sessionName, messageName, { type: "block.start", block_seq: 0, kind: "thinking" }]);
            "سأستعلم عن الفواتير المعتمدة لهذا الشهر مجمّعة بالفرع ثم أقارنها بالأهداف.".split(" ").forEach((w) => ev.push([60, sessionName, messageName, { type: "block.delta", block_seq: 0, delta: w + " " }]));
            ev.push([100, sessionName, messageName, { type: "block.done", block_seq: 0, block: { seq: 0, kind: "thinking", status: "completed", text: "سأستعلم عن الفواتير المعتمدة لهذا الشهر مجمّعة بالفرع ثم أقارنها بالأهداف.", duration_ms: 1800 } }]);
            ev.push([100, sessionName, messageName, { type: "block.start", block_seq: 1, kind: "tool_use", id: "toolu_09", name: "data__query" }]);
            ev.push([300, sessionName, messageName, { type: "block.delta", block_seq: 1, delta: '{"doctype": "Sales Inv' }]);
            ev.push([300, sessionName, messageName, { type: "block.done", block_seq: 1, block: { seq: 1, kind: "tool_use", status: "completed", id: "toolu_09", name: "data__query", data: { doctype: "Sales Invoice", filters: { docstatus: 1 }, group_by: "branch" } } }]);
            ev.push([900, sessionName, messageName, { type: "tool.result", block_seq: 2, duration_ms: 812, block: { seq: 2, kind: "tool_result", status: "completed", id: "toolu_09", name: "data__query", text: "4 rows", data: { columns: ["branch", "total"], rows: [{ branch: "الرياض", total: 512000 }, { branch: "جدة", total: 388000 }, { branch: "الدمام", total: 214000 }, { branch: "مكة", total: 126000 }], row_count: 4 } } }]);
            ev.push([200, sessionName, messageName, { type: "artifact.created", block_seq: 3, block: { seq: 3, kind: "artifact", status: "completed", data: { artifact: "ART-0003", artifact_type: "Table", title: "المبيعات حسب الفرع", row_count: 4, is_truncated: false, columns: ["الفرع", "المبيعات", "الهدف", "النسبة %"], rows } } }]);
            ev.push([200, sessionName, messageName, { type: "block.start", block_seq: 4, kind: "text" }]);
            words.forEach((w) => ev.push([45, sessionName, messageName, { type: "block.delta", block_seq: 4, delta: w + " " }]));
            ev.push([100, sessionName, messageName, { type: "block.done", block_seq: 4, block: { seq: 4, kind: "text", status: "completed", text: words.join(" ") } }]);
            if (phase === "approval") {
                ev.push([200, sessionName, messageName, { type: "approval.requested", block_seq: 5, approval: "APRQ-0007", block: { seq: 5, kind: "approval", status: "streaming", id: "toolu_10", name: "actions__request_create", data: { approval: "APRQ-0007", approval_id: "APR-0007", status: "Pending", action_type: "Create", doctype_name: "Sales Invoice", document_name: null, action_summary: "إنشاء فاتورة مبيعات لعميل شركة النور بقيمة 45,000 ر.س", impact_summary: "ستُنشأ الفاتورة كمسودة ولن تؤثر على الحسابات حتى الاعتماد.", payload: { customer: "شركة النور", posting_date: "2026-09-30", currency: "SAR", items: [{ item_code: "SRV-001", qty: 1, rate: 45000 }], remarks: "بناءً على طلب المستخدم" }, expires_at: ago(-2), result: null } } }]);
                ev.push([100, sessionName, messageName, { type: "usage", usage: usage, context_tokens: 22100, model: "deepseek-v4-flash" }]);
                ev.push([100, sessionName, messageName, { type: "message.done", status: "awaiting_approval", stop_reason: "tool_use", usage, steps: 2, tool_calls: 2 }]);
            } else {
                ev.push([100, sessionName, messageName, { type: "usage", usage: usage, context_tokens: 19600, model: "deepseek-v4-flash" }]);
                ev.push([100, sessionName, messageName, { type: "message.done", status: "completed", stop_reason: "end_turn", usage, steps: 2, tool_calls: 1 }]);
                ev.push([100, sessionName, messageName, { type: "session.updated", session: Object.assign({}, sessions.find((s) => s.name === sessionName) || session(sessionName, "", 0), { title: "مبيعات الشهر حسب الفرع", context_tokens: 19600, last_message_on: now(), preview: words.slice(0, 12).join(" ") }) }]);
            }
            return schedule(ev);
        }
        function resumeAfterApproval(sessionName, messageName, snapshot) {
            const ev = [];
            ev.push([200, sessionName, messageName, { type: "approval.decided", block_seq: 5, block: { seq: 5, kind: "approval", status: "completed", id: "toolu_10", name: "actions__request_create", data: snapshot } }]);
            ev.push([200, sessionName, messageName, { type: "message.started", model: "deepseek-v4-flash", provider: "Default", resumed: true }]);
            ev.push([100, sessionName, messageName, { type: "block.start", block_seq: 6, kind: "text" }]);
            const done = (snapshot.status === "Approved" || snapshot.status === "Executed") ? "تم إنشاء الفاتورة **SINV-0042** كمسودة. هل تريد اعتمادها الآن؟" : "حسناً، لن أُنشئ الفاتورة. أخبرني إن أردت تعديل البيانات.";
            done.split(" ").forEach((w) => ev.push([45, sessionName, messageName, { type: "block.delta", block_seq: 6, delta: w + " " }]));
            ev.push([100, sessionName, messageName, { type: "block.done", block_seq: 6, block: { seq: 6, kind: "text", status: "completed", text: done } }]);
            ev.push([100, sessionName, messageName, { type: "message.done", status: "completed", stop_reason: "end_turn", usage, steps: 3, tool_calls: 2 }]);
            // continue the per-message seq after the earlier stream
            const base = window.MOCK.lastSeq[messageName] || 0;
            let t = 0;
            ev.forEach(([delay, s, m, event], i) => {
                t += delay / window.MOCK.speed;
                timers.push(setTimeout(() => emit({ session: s, message: m, seq: base + i + 1, event }), t));
            });
        }
        window.MOCK.lastSeq = {};
        const origEmit = emit;
        emit = function (payload) {
            window.MOCK.lastSeq[payload.message] = payload.seq;
            origEmit(payload);
        };

        /* ---------------- frappe stub ---------------- */
        const converter = new showdown.Converter({ tables: true, simplifiedAutoLink: true });
        const ChartLib = (window["frappe-charts"] && window["frappe-charts"].Chart) || window["frappe-charts"];
        let pendingApproval = null;
        const handlers = {
            bootstrap: () => boot,
            list_sessions: (a) => ({ sessions: sessions.filter((s) => !a.search || s.title.includes(a.search)), has_more: false }),
            get_session: (a) => ({ session: sessions.find((s) => s.name === a.session) || session(a.session, "محادثة", 0) }),
            get_messages: (a) => ({ messages: a.session === "CHAT-00012" ? historyMessages : [], has_more: a.session === "CHAT-00012" }),
            // like the server, a live message comes back with its streamed tail merged in:
            // the mock reads the client's own store snapshot (private "_" fields stripped)
            get_message: (a) => {
                const hist = historyMessages.find((m) => m.name === a.message);
                if (hist) return { message: hist };
                const live = window.AIChat && window.AIChat.store.getMessage(a.message);
                if (live) return { message: JSON.parse(JSON.stringify(live, (k, v) => (k.startsWith("_") ? undefined : v))) };
                return { message: { name: a.message, session: "CHAT-00012", seq: 9, role: "assistant", status: "completed", blocks: [], usage: {} } };
            },
            send_message: (a) => {
                const isNew = !a.session;
                const s = isNew ? session("CHAT-000" + sessionCounter++, "محادثة جديدة", 0, { context_tokens: 0, message_count: 0 }) : sessions.find((x) => x.name === a.session) || session(a.session, "محادثة", 0);
                if (isNew) sessions.unshift(s);
                const seq = (s.last_seq || 0) + 1;
                s.last_seq = seq + 1;
                const userName = "u" + msgCounter++;
                const asstName = "a" + msgCounter++;
                const phase = /فاتورة|عرض سعر|أنشئ/.test(a.text) ? "approval" : "normal";
                window.MOCK.lastAssistant = asstName;
                setTimeout(() => streamReply(s.name, asstName, phase), 50);
                return {
                    session: s,
                    user_message: { name: userName, session: s.name, seq, role: "user", status: "completed", text: a.text, created_at: now(), attachments: (a.files || []).map((f) => ({ name: f, file_name: f + ".pdf", file_url: "#", file_size: 1024 })), blocks: [], feedback: 0, usage: {} },
                    assistant_message: { name: asstName, session: s.name, seq: seq + 1, role: "assistant", status: "pending", text: "", created_at: now(), blocks: [], feedback: 0, usage: {}, event_seq: 0 },
                };
            },
            stop_message: (a) => {
                timers.forEach(clearTimeout);
                setTimeout(() => emit({ session: "CHAT-00012", message: a.message, seq: (window.MOCK.lastSeq[a.message] || 0) + 1, event: { type: "message.cancelled", usage } }), 200);
                return { status: "cancelling" };
            },
            retry_message: (a) => {
                const asstName = "a" + msgCounter++;
                window.MOCK.lastAssistant = asstName;
                setTimeout(() => streamReply("CHAT-00012", asstName, "normal"), 50);
                return { assistant_message: { name: asstName, session: "CHAT-00012", seq: 9, role: "assistant", status: "pending", text: "", created_at: now(), blocks: [], usage: {}, event_seq: 0 } };
            },
            edit_message: (a) => {
                const asstName = "a" + msgCounter++;
                window.MOCK.lastAssistant = asstName;
                setTimeout(() => streamReply("CHAT-00012", asstName, "normal"), 50);
                return {
                    user_message: { name: "u" + msgCounter++, session: "CHAT-00012", seq: 3, role: "user", status: "completed", text: a.text, created_at: now(), blocks: [], attachments: [], usage: {} },
                    assistant_message: { name: asstName, session: "CHAT-00012", seq: 4, role: "assistant", status: "pending", text: "", created_at: now(), blocks: [], usage: {}, event_seq: 0 },
                };
            },
            decide_approval: (a) => {
                const snap = { approval: a.approval, approval_id: "APR-0007", status: a.decision === "approve" ? "Approved" : "Rejected", action_type: "Create", doctype_name: "Sales Invoice", document_name: null, action_summary: "إنشاء فاتورة مبيعات لعميل شركة النور بقيمة 45,000 ر.س", impact_summary: "ستُنشأ الفاتورة كمسودة.", payload: { customer: "شركة النور", items: [{ item_code: "SRV-001", qty: 1, rate: 45000 }] }, result: a.decision === "approve" ? { document_name: "SINV-0042" } : null, decided_by: "dev-t@sanad.digital", decided_at: now(), reason: a.reason || "" };
                if (snap.status === "Approved") snap.status = "Executed";
                const msg = window.MOCK.lastAssistant;
                const sess = sessions[0].name;
                setTimeout(() => resumeAfterApproval(sess, msg, snap), 100);
                return { approval: snap, message: msg };
            },
            rename_session: (a) => { const s = sessions.find((x) => x.name === a.session); if (s) s.title = a.title; return { session: s }; },
            archive_session: (a) => { const s = sessions.find((x) => x.name === a.session); if (s) s.status = a.archived ? "Archived" : "Active"; return { session: s }; },
            pin_session: (a) => { const s = sessions.find((x) => x.name === a.session); if (s) s.pinned = a.pinned; return { session: s }; },
            delete_session: (a) => { const i = sessions.findIndex((x) => x.name === a.session); if (i >= 0) sessions.splice(i, 1); return { session: a.session }; },
            list_skills: () => ({ skills: [{ name: "sales-analysis", title: "تحليل المبيعات", description: "استعلامات مبيعات جاهزة" }, { name: "quotation", title: "إعداد عرض سعر", description: "يجهّز عرض سعر من وصف نصي" }, { name: "aging", title: "أعمار الديون", description: "تقرير الذمم المدينة" }] }),
            search_documents: (a) => ({ results: [{ doctype: "Customer", name: "CUST-0001", title: "شركة النور" }, { doctype: "Sales Invoice", name: "SINV-0031", title: "SINV-0031 · شركة النور" }].filter((r) => !a.txt || r.title.includes(a.txt)) }),
            feedback: () => ({ ok: true }),
            get_artifact: (a) => ({ artifact: { artifact: a.artifact, artifact_type: "Table", title: "المبيعات مقابل الهدف حسب الفرع", row_count: 12, columns: ["الفرع", "المبيعات", "الهدف", "النسبة %"], rows: rows.concat(rows, rows) } }),
        };

        const memories = [
            { name: "MEM-0001", type: "Preference", scope: "User", agent: "ERP Analyst", company: null, content: "يفضّل المستخدم عرض المبالغ بالريال السعودي مع فاصل الآلاف", entity: null, modified: ago(2) },
            { name: "MEM-0002", type: "Context", scope: "Company", agent: "ERP Analyst", company: "Sanad Digital", content: "المستخدم يتابع أداء الفروع مقابل الأهداف شهرياً ويهتم بفرع مكة", entity: null, modified: ago(30) },
            { name: "MEM-0003", type: "Mapping", scope: "Agent", agent: "ERP Analyst", company: null, content: "\"النور\" تعني العميل CUST-0001 (شركة النور للتجارة)", entity: "Customer: CUST-0001", modified: ago(100) },
            { name: "MEM-0004", type: "Preference", scope: "User", agent: null, company: null, content: "الردود المختصرة مع جدول واحد كحد أقصى", entity: null, modified: ago(300) },
        ];
        Object.assign(handlers, {
            list_memories: () => ({ enabled: true, memories }),
            delete_memory: (a) => { const i = memories.findIndex((m) => m.name === a.memory); if (i >= 0) memories.splice(i, 1); return { deleted: a.memory }; },
            remember_now: () => { memories.unshift({ name: "MEM-000" + (memories.length + 5), type: "Context", scope: "User", agent: "ERP Analyst", content: "آخر تحليل طلبه المستخدم: مبيعات الشهر حسب الفرع", entity: null, modified: now() }); return { stored: 1 }; },
        });

        window.__ = (s, args) => (args ? s.replace(/\{(\d+)\}/g, (m, i) => (args[i] === undefined ? m : args[i])) : s);
        window.frappe = {
            csrf_token: "mock",
            boot: { lang },
            route_options: null,
            xcall: (method, args) => {
                const name = method.replace("ai_agent.chat.api.", "");
                window.MOCK.calls.push({ name, args });
                const fn = handlers[name];
                if (!fn) return Promise.reject(new Error("no handler " + name));
                try {
                    return new Promise((res) => setTimeout(() => res(JSON.parse(JSON.stringify(fn(args || {})))), 60));
                } catch (e) {
                    return Promise.reject(e);
                }
            },
            realtime: { on: (topic, fn) => { (listeners[topic] = listeners[topic] || []).push(fn); }, off: () => {} },
            socketio: { socket: { connected: true, on: () => {} } },
            markdown: (txt) => converter.makeHtml(txt),
            Chart: ChartLib,
            show_alert: (o) => window.MOCK.calls.push({ name: "show_alert", args: o }),
            get_route: () => route,
            set_route: (...parts) => { route = parts.filter((p) => typeof p === "string"); },
            router: { slug: (dt) => dt.toLowerCase().replace(/ /g, "-") },
            require: (path) => new Promise((res) => {
                if (path.endsWith(".css")) { const l = document.createElement("link"); l.rel = "stylesheet"; l.href = path; l.onload = res; l.onerror = res; document.head.appendChild(l); }
                else { const s = document.createElement("script"); s.src = path; s.onload = res; s.onerror = res; document.head.appendChild(s); }
            }),
        };

        window.MOCK.ready = (async () => {
            for (const m of ["core", "store", "transport", "blocks", "message", "composer", "sidebar", "memory", "list", "app"]) {
                await frappe.require("./" + m + ".js");
            }
            const main = document.getElementById("main");
            const page = { main: { append: (el) => main.appendChild(el), empty: () => (main.innerHTML = ""), html: (s) => (main.innerHTML = s) } };
            window.MOCK.app = await window.AIChat.mount(document.getElementById("page-agent-workspace"), page);
            return window.MOCK.app;
        })();
    })();
    </script>
</body>
</html>

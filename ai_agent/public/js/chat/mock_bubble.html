<!doctype html>
<!--
  mock_bubble.html — a fake Desk page for the floating support chat.
  Loads ONLY chat_bubble.css + chat_bubble.js, exactly like production
  (app_include_*). `frappe` is stubbed: support.bootstrap / send_message /
  list_sessions, the chat.api endpoints, a scripted realtime stream
  (thinking → tool + MCP view → text, or an approval), a router with
  `change` events and a `frappe.require` that records what was loaded.
  Query: ?dir=rtl|ltr &theme=dark &enabled=0 &access=0 &session=1 &old=1 &fail=1
  MOCK.setRoute([...]) navigates; MOCK.mountWorkspace() mounts the full page.
-->
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sales Invoice ACC-SINV-2026-00042</title>
    <link rel="stylesheet" href="../../musaed-brand/fonts/fonts.css" />
    <link rel="stylesheet" href="../../musaed-brand/tokens/tokens.css" />
    <link rel="stylesheet" href="../../musaed-brand/motion/motion.css" />
    <link rel="stylesheet" href="../../css/chat_bubble.css" />
    <style>
        html, body { margin: 0; min-height: 100%; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Arabic", Arial, sans-serif; background: #f4f5f6; color: #1f272e; font-size: 13px; }
        [data-theme="dark"] body { background: #161616; color: #d6d6d6; }
        .navbar { height: 48px; display: flex; align-items: center; padding: 0 16px; background: #fff; border-bottom: 1px solid #e2e6e9; }
        .desk-form { max-width: 960px; margin: 16px auto; padding: 0 16px; }
        .desk-form h1 { font-size: 20px; margin: 8px 0 16px; }
        .desk-card { background: #fff; border: 1px solid #e2e6e9; border-radius: 10px; padding: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px; }
        .desk-field label { display: block; font-size: 11px; color: #7c8791; margin-bottom: 4px; }
        .desk-field div { height: 30px; border-radius: 6px; background: #f4f5f6; padding: 6px 10px; box-sizing: border-box; }
        [data-theme="dark"] .navbar, [data-theme="dark"] .desk-card { background: #1f1f1f; border-color: #303030; }
        [data-theme="dark"] .desk-field div { background: #2a2a2a; }
        .page-container[hidden] { display: none; }
    </style>
    <!-- Desk globals that exist on every page (not chat modules) -->
    <script src="../../../../../frappe/node_modules/showdown/dist/showdown.min.js"></script>
</head>
<body>
    <nav class="navbar">Frappe Desk (mock)</nav>
    <div class="page-container" id="page-form">
        <div class="desk-form">
            <h1>فاتورة مبيعات · ACC-SINV-2026-00042</h1>
            <div class="desk-card">
                <div class="desk-field"><label>العميل</label><div>شركة النور</div></div>
                <div class="desk-field"><label>التاريخ</label><div>2026-09-30</div></div>
                <div class="desk-field"><label>الإجمالي</label><div>45,000.00 ر.س</div></div>
                <div class="desk-field"><label>الحالة</label><div>مسودة</div></div>
            </div>
        </div>
    </div>
    <div class="page-container ai-chat-page" id="page-agent-workspace" hidden>
        <div class="page-body"><div class="layout-main-section" id="ws-main"></div></div>
    </div>

    <script>
    (function () {
        const params = new URLSearchParams(location.search);
        const dir = params.get("dir") || "rtl";
        const lang = dir === "rtl" ? "ar" : "en";
        document.documentElement.setAttribute("dir", dir);
        document.documentElement.setAttribute("lang", lang);
        document.documentElement.setAttribute("data-theme", params.get("theme") === "dark" ? "dark" : "light");
        if (params.get("old") === "1") { const o = document.createElement("div"); o.id = "ai-chatbot-fab"; document.body.appendChild(o); }

        const MOCK = (window.MOCK = { calls: [], required: [], routes: [], events: 0, lastSeq: {}, failSend: params.get("fail") === "1" });
        const p2 = (n) => String(n).padStart(2, "0");
        const ts = (d) => `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`;
        const now = () => ts(new Date());
        const ago = (h) => ts(new Date(Date.now() - h * 3600000));
        const usage = { input_tokens: 3100, output_tokens: 420, cache_read_input_tokens: 0, cache_creation_input_tokens: 0, estimated_cost: 0.002 };
        const mkSession = (name, title, hours) => ({ name, title, agent: "Support Assistant", company: null, provider: "Default", model: "deepseek-v4-flash", status: "Active", pinned: 0, last_message_on: ago(hours), message_count: 2, preview: "يمكنك إنشاء الفاتورة من قائمة المبيعات ثم…", usage, context_tokens: 4200, context_window: 128000, last_seq: 2 });
        const supportSessions = [mkSession("CHAT-00021", "طريقة إنشاء فاتورة مبيعات", 2), mkSession("CHAT-00019", "صلاحيات تقرير أعمار الديون", 30), mkSession("CHAT-00015", "تعديل قالب الطباعة", 120)];
        const text = (name, session, seq, role, body) => ({ name, session, seq, role, status: "completed", text: body, created_at: ago(2), completed_at: ago(2), duration_ms: 2100, model: "deepseek-v4-flash", attachments: [], feedback: 0, usage: role === "assistant" ? usage : {}, event_seq: 5, blocks: role === "assistant" ? [{ seq: 0, kind: "text", status: "completed", text: body }] : [] });
        const db = {
            "CHAT-00021": [text("h1", "CHAT-00021", 1, "user", "كيف أنشئ فاتورة مبيعات؟"), text("h2", "CHAT-00021", 2, "assistant", "من **المبيعات ← فاتورة مبيعات ← جديد**:\n\n1. اختر العميل.\n2. أضف الأصناف والكميات.\n3. احفظ ثم اعتمد.")],
            "CHAT-00019": [text("h3", "CHAT-00019", 1, "user", "لماذا لا أرى تقرير أعمار الديون؟"), text("h4", "CHAT-00019", 2, "assistant", "التقرير يتطلب دور **Accounts User**.")],
            "CHAT-00015": [],
        };
        const rows = [
            { الصنف: "SRV-001", الوصف: "خدمة استشارية", الكمية: 1, السعر: 45000, الإجمالي: 45000 },
            { الصنف: "SRV-002", الوصف: "دعم فني سنوي", الكمية: 2, السعر: 6000, الإجمالي: 12000 },
        ];
        const VIEW_HTML = `<!doctype html><html dir="${dir}"><body style="margin:0;font:13px sans-serif"><div style="overflow-x:auto"><table id="t" style="border-collapse:collapse;min-width:640px;width:100%"></table></div><script>
            const post = (m) => parent.postMessage(Object.assign({ jsonrpc: "2.0" }, m), "*");
            addEventListener("message", (e) => {
                const m = e.data || {};
                if (m.id === 1 && m.result) post({ method: "ui/notifications/initialized" });
                if (m.method === "ui/notifications/tool-result") {
                    const sc = m.params.structuredContent || {};
                    const cell = (t, v) => "<" + t + " style='padding:6px 10px;border-bottom:1px solid #ddd;text-align:start;white-space:nowrap'>" + v + "</" + t + ">";
                    document.getElementById("t").innerHTML = "<tr>" + sc.columns.map((c) => cell("th", c)).join("") + "</tr>" + sc.rows.map((r) => "<tr>" + sc.columns.map((c) => cell("td", r[c])).join("") + "</tr>").join("");
                    post({ method: "ui/notifications/size-changed", params: { height: document.body.scrollHeight } });
                }
            });
            post({ id: 1, method: "ui/initialize", params: {} });
        <\/script></body></html>`;

        /* ---------------- realtime ---------------- */
        const listeners = {};
        let timers = [];
        let counter = 100, sessionCounter = 30;
        function emit(payload) {
            MOCK.events++;
            MOCK.lastSeq[payload.message] = payload.seq;
            (listeners["ai_agent:chat"] || []).forEach((fn) => fn(payload));
            if (/^message\.(done|failed|cancelled)$/.test(payload.event.type)) setTimeout(() => snapshot(payload.session), 30);
        }
        // the "server" copy of a conversation = the client's store without private fields
        function snapshot(session) {
            const st = window.AIChat && window.AIChat.store;
            if (!st || !st.state.current || st.state.current.name !== session) return;
            db[session] = st.state.order.map((n) => JSON.parse(JSON.stringify(st.getMessage(n), (k, v) => (k.startsWith("_") ? undefined : v))));
        }
        function play(session, message, list, base) {
            let t = 0;
            list.forEach(([delay, event], i) => {
                t += delay;
                timers.push(setTimeout(() => emit({ session, message, seq: (base || 0) + i + 1, event }), t));
            });
        }
        const answer = "تتكوّن هذه الفاتورة من **صنفين** بإجمالي **57,000 ر.س** وهي ما زالت **مسودة**.\n\n- العميل: شركة النور\n- لم تُسجَّل أي دفعات بعد\n\nهل تريد اعتمادها أو تعديل الأصناف؟".split(" ");
        function stream(session, message, phase) {
            const ev = [[150, { type: "message.started", model: "deepseek-v4-flash", provider: "Default", resumed: false }], [80, { type: "block.start", block_seq: 0, kind: "thinking" }]];
            const thought = "سأقرأ بيانات الفاتورة المفتوحة ثم ألخّص أصنافها وحالتها.";
            thought.split(" ").forEach((w) => ev.push([50, { type: "block.delta", block_seq: 0, delta: w + " " }]));
            ev.push([80, { type: "block.done", block_seq: 0, block: { seq: 0, kind: "thinking", status: "completed", text: thought, duration_ms: 1400 } }]);
            ev.push([80, { type: "block.start", block_seq: 1, kind: "tool_use", id: "toolu_31", name: "data__query" }]);
            ev.push([250, { type: "block.done", block_seq: 1, block: { seq: 1, kind: "tool_use", status: "completed", id: "toolu_31", name: "data__query", data: { doctype: "Sales Invoice Item", filters: { parent: "ACC-SINV-2026-00042" } } } }]);
            ev.push([600, { type: "tool.result", block_seq: 2, duration_ms: 640, block: { seq: 2, kind: "tool_result", status: "completed", id: "toolu_31", name: "data__query", text: "2 rows", data: { columns: Object.keys(rows[0]), rows, row_count: 2, view: { content: [{ type: "text", text: "2 rows" }], structuredContent: { columns: Object.keys(rows[0]), rows } } } } }]);
            ev.push([150, { type: "block.start", block_seq: 3, kind: "text" }]);
            answer.forEach((w) => ev.push([45, { type: "block.delta", block_seq: 3, delta: w + " " }]));
            ev.push([80, { type: "block.done", block_seq: 3, block: { seq: 3, kind: "text", status: "completed", text: answer.join(" ") } }]);
            if (phase === "approval") {
                ev.push([150, { type: "approval.requested", block_seq: 4, approval: "APRQ-0011", block: { seq: 4, kind: "approval", status: "streaming", id: "toolu_32", name: "actions__request_submit", data: approvalSnap("Pending") } }]);
                ev.push([80, { type: "message.done", status: "awaiting_approval", stop_reason: "tool_use", usage, steps: 2, tool_calls: 2 }]);
            } else {
                ev.push([80, { type: "usage", usage, context_tokens: 5200, model: "deepseek-v4-flash" }]);
                ev.push([80, { type: "message.done", status: "completed", stop_reason: "end_turn", usage, steps: 2, tool_calls: 1 }]);
            }
            play(session, message, ev);
        }
        function approvalSnap(status, reason) {
            return { approval: "APRQ-0011", approval_id: "APR-0011", status, action_type: "Submit", doctype_name: "Sales Invoice", document_name: "ACC-SINV-2026-00042", action_summary: "اعتماد فاتورة المبيعات ACC-SINV-2026-00042 بقيمة 57,000 ر.س", impact_summary: "سيُرحَّل القيد المحاسبي ولن يمكن تعديل الفاتورة بعد الاعتماد.", payload: { customer: "شركة النور", grand_total: 57000, items: rows }, expires_at: ago(-2), result: status === "Executed" ? { document_name: "ACC-SINV-2026-00042" } : null, decided_by: status === "Pending" ? null : "dev-t@sanad.digital", decided_at: status === "Pending" ? null : now(), reason: reason || "" };
        }

        /* ---------------- endpoints ---------------- */
        const user = { name: "dev-t@sanad.digital", full_name: "أحمد", image: null, language: lang, dir };
        const reply = (session, phase) => {
            const s = session;
            const seq = (s.last_seq || 0) + 1;
            s.last_seq = seq + 1;
            s.last_message_on = now();
            const u = "u" + counter++, a = "a" + counter++;
            MOCK.lastAssistant = a;
            MOCK.lastSession = s.name;
            setTimeout(() => stream(s.name, a, phase), 40);
            return { u, a, seq };
        };
        const handlers = {
            "ai_agent.chat.support.bootstrap": () => {
                if (params.get("enabled") === "0") return { enabled: false };
                if (params.get("access") === "0") return { enabled: true, can_access: false };
                return {
                    enabled: true, can_access: true, title: "مساعد الدعم", welcome_message: "مرحباً أحمد،\n\nأنا مساعد الدعم. اسألني عن أي شاشة أو مستند أو تقرير في النظام.",
                    agent: { name: "Support Assistant", agent_name: "مساعد سند" }, user, session: params.get("session") === "1" ? supportSessions[0] : null,
                    suggestions: [{ label: "كيف أنشئ فاتورة مبيعات؟" }, { label: "لخّص هذا المستند", needs_document: 1 }, { label: "ما التقارير المتاحة لي؟" }],
                    third_party_warning: "قد تُرسَل محتويات المحادثة إلى مزوّد نماذج خارجي.",
                };
            },
            "ai_agent.chat.support.send_message": (a) => {
                if (MOCK.failSend) { MOCK.failSend = false; throw new Error("تعذّر الوصول إلى الخادم، حاول مجدداً"); }
                let s = supportSessions.find((x) => x.name === a.session);
                if (!s) { s = mkSession("CHAT-000" + sessionCounter++, a.text.slice(0, 40), 0); s.last_seq = 0; supportSessions.unshift(s); db[s.name] = []; }
                const r = reply(s, /اعتمد|اعتماد/.test(a.text) ? "approval" : "normal");
                return {
                    session: s,
                    user_message: { name: r.u, session: s.name, seq: r.seq, role: "user", status: "completed", text: a.text, created_at: now(), attachments: (a.files || []).map((f) => ({ name: f, file_name: f, file_url: "#", file_size: 2048 })), blocks: [], feedback: 0, usage: {} },
                    assistant_message: { name: r.a, session: s.name, seq: r.seq + 1, role: "assistant", status: "pending", text: "", created_at: now(), blocks: [], feedback: 0, usage: {}, event_seq: 0 },
                };
            },
            "ai_agent.chat.support.list_sessions": () => ({ sessions: supportSessions }),
            get_messages: (a) => ({ messages: db[a.session] || [], has_more: false }),
            get_message: (a) => {
                const live = window.AIChat && window.AIChat.store.getMessage(a.message);
                return { message: live ? JSON.parse(JSON.stringify(live, (k, v) => (k.startsWith("_") ? undefined : v))) : { name: a.message, blocks: [], status: "completed", usage: {} } };
            },
            get_session: (a) => ({ session: supportSessions.find((s) => s.name === a.session) }),
            stop_message: (a) => {
                timers.forEach(clearTimeout); timers = [];
                setTimeout(() => emit({ session: MOCK.lastSession, message: a.message, seq: (MOCK.lastSeq[a.message] || 0) + 1, event: { type: "message.cancelled", usage } }), 120);
                return { status: "cancelling" };
            },
            retry_message: () => {
                const s = supportSessions.find((x) => x.name === MOCK.lastSession);
                const a = "a" + counter++;
                MOCK.lastAssistant = a;
                setTimeout(() => stream(s.name, a, "normal"), 40);
                return { assistant_message: { name: a, session: s.name, seq: s.last_seq, role: "assistant", status: "pending", text: "", created_at: now(), blocks: [], usage: {}, event_seq: 0 } };
            },
            decide_approval: (a) => {
                const snap = approvalSnap(a.decision === "approve" ? "Executed" : "Rejected", a.reason);
                const m = MOCK.lastAssistant, s = MOCK.lastSession, base = MOCK.lastSeq[m] || 0;
                const done = a.decision === "approve" ? "تم اعتماد الفاتورة **ACC-SINV-2026-00042** بنجاح." : "لم أعتمد الفاتورة.";
                const ev = [[150, { type: "approval.decided", block_seq: 4, block: { seq: 4, kind: "approval", status: "completed", id: "toolu_32", name: "actions__request_submit", data: snap } }], [150, { type: "message.started", model: "deepseek-v4-flash", provider: "Default", resumed: true }], [80, { type: "block.start", block_seq: 5, kind: "text" }]];
                done.split(" ").forEach((w) => ev.push([45, { type: "block.delta", block_seq: 5, delta: w + " " }]));
                ev.push([80, { type: "block.done", block_seq: 5, block: { seq: 5, kind: "text", status: "completed", text: done } }], [80, { type: "message.done", status: "completed", stop_reason: "end_turn", usage, steps: 3, tool_calls: 2 }]);
                setTimeout(() => play(s, m, ev, base), 60);
                return { approval: snap, message: m };
            },
            delete_session: (a) => { const i = supportSessions.findIndex((s) => s.name === a.session); if (i >= 0) supportSessions.splice(i, 1); return { session: a.session }; },
            rename_session: (a) => ({ session: Object.assign(supportSessions.find((s) => s.name === a.session) || {}, { title: a.title }) }),
            feedback: () => ({ ok: true }),
            view_html: () => ({ html: VIEW_HTML }),
            view_call: () => ({ content: [], structuredContent: { columns: Object.keys(rows[0]), rows } }),
            // the full page (MOCK.mountWorkspace)
            bootstrap: () => ({ user, agents: [{ name: "ERP Analyst", agent_name: "محلل ERP", description: "", read_only: 0, allow_actions: 1, is_default: 1 }], providers: [{ name: "Default", label: "DeepSeek", is_default: 1, models: [{ model_name: "deepseek-v4-flash", label: "DeepSeek V4 Flash", is_default: 1, supports_thinking: 1 }] }], settings: { third_party_warning: "", thinking_options: ["off", "adaptive", "on"] }, sessions: [] }),
            list_sessions: () => ({ sessions: [], has_more: false }),
            list_skills: () => ({ skills: [] }),
        };

        /* ---------------- frappe stub ---------------- */
        let route = ["Form", "Sales Invoice", "ACC-SINV-2026-00042"];
        const routeHandlers = [];
        const converter = new showdown.Converter({ tables: true, simplifiedAutoLink: true });
        const loaded = new Set();
        function applyRoute(next) {
            route = next;
            MOCK.routes.push(next.slice());
            document.getElementById("page-form").hidden = route[0] === "agent-workspace";
            document.getElementById("page-agent-workspace").hidden = route[0] !== "agent-workspace";
            routeHandlers.forEach((fn) => fn());
            if (route[0] === "agent-workspace" && MOCK.workspace) MOCK.workspace.onShow();
        }
        MOCK.setRoute = applyRoute;
        window.__ = (s, args) => (args ? String(s).replace(/\{(\d+)\}/g, (m, i) => (args[i] === undefined ? m : args[i])) : ({ "Sales Invoice": "فاتورة مبيعات", Customer: "عميل" }[s] || s));
        window.frappe = {
            csrf_token: "mock",
            boot: { lang },
            session: { user: user.name },
            route_options: null,
            xcall: (method, args) => {
                MOCK.calls.push({ method, args: args || {} });
                const fn = handlers[method] || handlers[method.replace("ai_agent.chat.api.", "")];
                return new Promise((res, rej) => setTimeout(() => {
                    if (!fn) return rej(new Error("no handler " + method));
                    try { res(JSON.parse(JSON.stringify(fn(args || {})))); } catch (e) { rej(e); }
                }, 60));
            },
            realtime: { on: (topic, fn) => (listeners[topic] = listeners[topic] || []).push(fn), off: () => {} },
            socketio: { socket: { connected: true, on: () => {} } },
            markdown: (txt) => converter.makeHtml(txt),
            show_alert: () => {},
            get_route: () => route,
            set_route: (...parts) => applyRoute(parts.flat().filter((p) => typeof p === "string")),
            router: { on: (ev, fn) => ev === "change" && routeHandlers.push(fn), slug: (dt) => dt.toLowerCase().replace(/ /g, "-") },
            require: (path) => new Promise((res) => {
                const file = path.replace("/assets/ai_agent/", "../../");
                MOCK.required.push(path);
                if (loaded.has(path)) return res();
                loaded.add(path);
                const el = path.endsWith(".css") ? Object.assign(document.createElement("link"), { rel: "stylesheet", href: file }) : Object.assign(document.createElement("script"), { src: file });
                el.onload = res; el.onerror = res;
                document.head.appendChild(el);
            }),
        };
        // the agent-workspace page, mounted like its page entry does
        MOCK.mountWorkspace = async () => {
            await frappe.require("/assets/ai_agent/css/chat.css");
            for (const m of ["core", "store", "transport", "viewhost", "blocks", "message", "composer", "sidebar", "memory", "list", "app"]) await frappe.require("/assets/ai_agent/js/chat/" + m + ".js");
            const main = document.getElementById("ws-main");
            MOCK.workspace = await window.AIChat.mount(document.getElementById("page-agent-workspace"), { main: { append: (el) => main.appendChild(el) } });
            return true;
        };
    })();
    </script>
    <script src="../chat_bubble.js"></script>
</body>
</html>

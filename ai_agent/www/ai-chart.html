{% extends "templates/web.html" %}

{% block title %}{{ title }}{% endblock %}

{% block favicon %}
<link rel="icon" href="/assets/ai_agent/musaed-brand/assets/favicon/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/ai_agent/musaed-brand/assets/favicon/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/ai_agent/musaed-brand/assets/favicon/apple-touch-icon.png">
{% endblock %}

{% block page_content %}
<link rel="stylesheet" href="/assets/frappe/node_modules/frappe-charts/dist/frappe-charts.min.css">
<link rel="stylesheet" href="/assets/ai_agent/musaed-brand/fonts/fonts.css">
<link rel="stylesheet" href="/assets/ai_agent/musaed-brand/tokens/tokens.css">
<div dir="auto" style="max-width: 960px; margin: 32px auto; font-family: var(--ms-font-ui);">
	<h2 style="margin-bottom: 16px; font-family: var(--ms-font-brand); color: var(--ms-heading);">{{ title }}</h2>
	<div id="ai-chart"></div>
	<p id="ai-chart-error" class="text-muted" style="display: none;">{{ _("Could not draw the chart.") }}</p>
</div>
{% endblock %}

{% block script %}
<script src="/assets/frappe/node_modules/frappe-charts/dist/frappe-charts.umd.js"></script>
<script>
(function () {
	const spec = {{ chart | tojson }};
	// frappe-charts writes labels and series names into its tooltip as HTML: escape them.
	const esc = (v) => String(v === null || v === undefined ? "" : v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
	const labels = (spec.labels || []).map((label) => esc(label));
	const datasets = (spec.datasets || [])
		.filter((dataset) => dataset && Array.isArray(dataset.values))
		.map((dataset) => ({ name: esc(dataset.name || ""), values: dataset.values.map((v) => Number(v) || 0) }));
	const type = ["bar", "line", "pie", "percentage", "donut"].includes(String(spec.type)) ? String(spec.type) : "bar";
	try {
		const Chart = window["frappe-charts"].Chart;
		new Chart("#ai-chart", {
			data: { labels, datasets },
			type,
			height: 360,
			// Musaed clay first; the rest are validated distinct hues (the brand's petrol reads gray as a series)
			colors: ["#D97757", "#6366f1", "#0ea5e9", "#16a34a", "#f59e0b"],
			truncateLegends: true,
			axisOptions: { xIsSeries: 0, shortenYAxisNumbers: 1 },
		});
	} catch (error) {
		document.getElementById("ai-chart-error").style.display = "";
	}
})();
</script>
{% endblock %}
